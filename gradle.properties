# ==============================================================================
# AndroidX & Build Fixes
# ==============================================================================

# ENABLES ANDROIDX SUPPORT (Required for Compose, Hilt, Room, ML Kit, etc.)
# Fixes the checkDebugAarMetadata build failure in CI/CD.
android.useAndroidX=true

# SUPPRESSES AGP COMPILESDK WARNING
# Prevents AGP 8.5.2 from throwing warnings when building against compileSdk 35.
android.suppressUnsupportedCompileSdk=35


# ==============================================================================
# Gradle Daemon & JVM Performance
# ==============================================================================

# Allocates memory to the Gradle Daemon process and enforces UTF-8 encoding.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enables parallel build execution for multi-module speedups.
org.gradle.parallel=true

# Caches task outputs to avoid re-running unchanged build steps.
org.gradle.caching=true


# ==============================================================================
# Modern Android & Kotlin Code Settings
# ==============================================================================

# Sets default code formatting guidelines to the official Kotlin standard.
kotlin.code.style=official

# Optimizes resource processing and enables faster incremental builds.
android.nonTransitiveRClass=true
