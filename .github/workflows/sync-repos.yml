name: Mirror Source Repository

on:
  workflow_dispatch: # Allows manual trigger from Actions tab
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_PAT }}

      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          repository: rupeshRN/aivarsel
          token: ${{ secrets.SYNC_PAT }}
          path: temp-source

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync exact files from source repo
        run: |
          # Remove source repo's git history and its .github folder (to protect our workflow file)
          rm -rf temp-source/.git
          rm -rf temp-source/.github
          
          # Remove all existing files in destination except .git and .github
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name '.github' -exec rm -rf {} +
          
          # Copy everything from the source repo into the destination folder
          cp -r temp-source/. .
          
          # Clean up temporary folder
          rm -rf temp-source
          
          # Stage and commit changes if any differences exist
          git add .
          git diff --staged --quiet || git commit -m "Mirror sync: exact copy from source repository"
          
          # Push changes to destination repo
          git push origin main
