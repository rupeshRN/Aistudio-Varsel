name: Mirror Source Repository

on:
  workflow_dispatch: # Allows manual trigger from Actions tab
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_PAT }}

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone source repo outside workspace
        run: |
          # Clone securely into the runner's official temp directory (completely outside workspace)
          git clone https://x-access-token:${{ secrets.SYNC_PAT }}@github.com/rupeshRN/aivarsel.git "$RUNNER_TEMP/source-repo"

      - name: Sync exact files from source repo
        run: |
          # Remove source repo's git history and its .github folder (to protect our workflow file)
          rm -rf "$RUNNER_TEMP/source-repo/.git"
          rm -rf "$RUNNER_TEMP/source-repo/.github"
          
          # Remove all existing files in destination except .git and .github
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name '.github' -exec rm -rf {} +
          
          # Copy everything from the safe temp folder into our destination root
          cp -r "$RUNNER_TEMP/source-repo/." .
          
          # Clean up the temp folder
          rm -rf "$RUNNER_TEMP/source-repo"
          
          # Stage, commit, and push if there are changes
          git add .
          git diff --staged --quiet || git commit -m "Mirror sync: exact copy from source repository"
          git push origin main
