name: Generate Release Keystore Helper

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'Password for Keystore & Key (at least 6 characters)'
        required: true
        type: string
        default: 'VarselExpenseTrackerPass123'
      key_alias:
        description: 'Key Alias'
        required: true
        type: string
        default: 'varsel_release_key'
      dname:
        description: 'Distinguished Name / Organization'
        required: false
        type: string
        default: 'CN=Varsel, OU=Android, O=Varsel, C=IN'

jobs:
  generate:
    name: Generate Keystore & Base64
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate JKS Keystore
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -v \
            -keystore release.keystore \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass "${{ github.event.inputs.keystore_password }}" \
            -dname "${{ github.event.inputs.dname }}"

          # Encode to base64 single-line string
          B64_KEY=$(base64 -w 0 release.keystore)

          # Write to job summary so user can easily copy and paste
          echo "## 🔐 Generated Keystore Secrets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Copy the values below into **Settings -> Secrets and variables -> Actions -> New repository secret**:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 1. \`KEY_ALIAS\`" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ github.event.inputs.key_alias }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 2. \`KEYSTORE_PASSWORD\`" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ github.event.inputs.keystore_password }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 3. \`KEY_PASSWORD\`" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ github.event.inputs.keystore_password }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 4. \`SIGNING_KEY_BASE64\`" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>Click to expand and copy SIGNING_KEY_BASE64</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "$B64_KEY" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ *Download the attached artifact as a permanent backup of \`release.keystore\`.*" >> $GITHUB_STEP_SUMMARY

      - name: Upload Keystore Backup as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-backup
          path: release.keystore
          retention-days: 14
