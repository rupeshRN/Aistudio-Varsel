name: Production Release Build

on:
  push:
    tags:
      - 'v*.*.*' # Triggers on semantic version tags (e.g. v1.0.0, v1.2.3)
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  release:
    name: Build & Publish Signed Release
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required to create GitHub Releases and upload binaries

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ------------------------------------------------------------------------
      # Build Release Binaries (APK + App Bundle)
      # ------------------------------------------------------------------------
      - name: Build Release APK & AAB
        run: ./gradlew assembleRelease bundleRelease

      # ------------------------------------------------------------------------
      # Sign Release Binaries using Base64 Keystore from GitHub Secrets
      # ------------------------------------------------------------------------
      - name: Decode Android Release Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > app/release.keystore

      - name: Sign Release APK
        uses: r3d-act/signed-build-action@v1
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # ------------------------------------------------------------------------
      # Create GitHub Release & Upload Artifacts
      # ------------------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
