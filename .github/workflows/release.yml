name: Production Release Build

on:
  workflow_dispatch:

jobs:
  release:
    name: Build & Publish Signed Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ----------------------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # Java
      # ----------------------------------------------------------------------
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ----------------------------------------------------------------------
      # Gradle
      # ----------------------------------------------------------------------
      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ----------------------------------------------------------------------
      # Restore release keystore
      #
      # The keystore exists only on this temporary GitHub Actions runner.
      # It is never committed to Git.
      # ----------------------------------------------------------------------
      - name: Decode Android Release Keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$SIGNING_KEY_BASE64" ]; then
            echo "ERROR: SIGNING_KEY_BASE64 secret is not configured."
            exit 1
          fi

          echo "$SIGNING_KEY_BASE64" | base64 --decode > app/release.keystore

          if [ ! -s app/release.keystore ]; then
            echo "ERROR: Release keystore could not be created."
            exit 1
          fi

          echo "Release keystore restored successfully."

      # ----------------------------------------------------------------------
      # Build SIGNED Release APK + SIGNED Release AAB
      #
      # Gradle signingConfigs.release handles signing directly.
      # ----------------------------------------------------------------------
      - name: Build Signed Release APK & AAB
        env:
          VARSEL_KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore
          VARSEL_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VARSEL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VARSEL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$VARSEL_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is not configured."
            exit 1
          fi

          if [ -z "$VARSEL_KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS secret is not configured."
            exit 1
          fi

          if [ -z "$VARSEL_KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is not configured."
            exit 1
          fi

          ./gradlew assembleRelease bundleRelease

      # ----------------------------------------------------------------------
      # Verify signed APK
      # ----------------------------------------------------------------------
      - name: Verify Signed APK
        run: |
          set -euo pipefail

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          APK=$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not found."
            exit 1
          fi

          echo "Verifying:"
          echo "$APK"

          "$APKSIGNER" verify --verbose "$APK"

      # ----------------------------------------------------------------------
      # Verify signed AAB
      #
      # AAB files are ZIP/JAR-based packages and can be checked with jarsigner.
      # ----------------------------------------------------------------------
      - name: Verify Signed AAB
        run: |
          set -euo pipefail

          AAB=$(find app/build/outputs/bundle/release \
            -maxdepth 1 \
            -type f \
            -name "*.aab" \
            | head -n 1)

          if [ -z "$AAB" ]; then
            echo "ERROR: Release AAB was not found."
            exit 1
          fi

          echo "Verifying:"
          echo "$AAB"

          jarsigner -verify -verbose "$AAB"

      # ----------------------------------------------------------------------
      # Create GitHub Release
      # ----------------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.5" # Or dynamically: "v1.0.${{ github.run_number }}"
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: false
          generate_release_notes: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------------
      # Remove temporary keystore from the runner
      # ----------------------------------------------------------------------
      - name: Remove Temporary Keystore
        if: always()
        run: |
          rm -f app/release.keystore
