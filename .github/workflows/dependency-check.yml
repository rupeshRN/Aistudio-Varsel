name: Dependency Security Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Runs automatically every Sunday at midnight UTC to check for newly published CVEs
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Block PRs with high/critical security vulnerabilities
  # ----------------------------------------------------------------------------
  dependency-review:
    name: Dependency Review (PR Guard)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dependency Review Scan
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: LGPL-2.1, GPL-3.0 # Optional: Flags incompatible open-source licenses

  # ----------------------------------------------------------------------------
  # Job 2: OWASP Vulnerability Report Generation
  # ----------------------------------------------------------------------------
  owasp-scan:
    name: OWASP Dependency Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        id: owasp
        env:
          # Overrides runner's JDK environment path with internal container path
          JAVA_HOME: /opt/jdk
        with:
          project: 'VarselExpenseTracker'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --failOnCVSS 8

      - name: Upload Security Scan Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-report
          path: reports/
          retention-days: 14
